<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loggin</title>
    <style>
        /*Estilo y centrado*/
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: rgb(190, 231, 190);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /*Contenedor principal*/
        .logginBox {
            background-color: azure;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px black(0,0,0,0.1);
            width: 250px;
        }

        .inputGroup { 
            width: 300px;
        }

        /*Etiquetas de texto*/
        label {
            display: block;
            margin-bottom: 10px;
            color: brown;
        }

        /*Escribe la respuesta*/
        input {
            width: 80%;
            padding: 10px;
            border:  1px solid rebeccapurple;
            border-radius: 5px;
            box-sizing: border-box;
        }

        /*Caracteristicas del boton*/
        button {
            width: 100%;
            padding: 10px;
            background-color: bisque;
            border: none;
            border-radius: 4px;
            color: black;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        /*Titulo*/
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: black;
        }

    </style>
</head>
<body>
    <div class="logginBox">
        <h2>Iniciar sesión</h2>
        <form>
            <div class="inputGroup">
                <label>Usuario</label>
                <input type="text">
            </div>
            <div class="inputGroup">
                <label>Contraseña</label>
                <input type="password">
            </div>
            <button type="button">Entrar</button>
            <button type="button">Registrarse</button>
        </form>
    </div>
</body>
</html>
